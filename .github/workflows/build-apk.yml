name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Install native alarm engine
        run: |
          D=android/app/src/main/java/com/rohanchauhan/dailyroutine
          mkdir -p $D
          cp native/*.java $D/
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -c AlarmService android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rohan-Daily-Routine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
